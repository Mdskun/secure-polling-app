{{- /*
Only render the managed Secret when the user did not opt into an existing
one (secrets.existingSecret). Keys are resolved by the secretValue helper,
which reuses auto-generated values from the already-deployed Secret so they
survive `helm upgrade`.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "secure-polling-app.secretName" . }}
  labels:
    {{- include "secure-polling-app.labels" . | nindent 4 }}
data:
  SECRET_KEY: {{ include "secure-polling-app.secretValue" (dict "ctx" . "key" "SECRET_KEY" "default" (randAlphaNum 48 | b64enc)) }}
  ADMINU: {{ include "secure-polling-app.secretValue" (dict "ctx" . "key" "ADMINU" "default" "") }}
  ADMINP: {{ include "secure-polling-app.secretValue" (dict "ctx" . "key" "ADMINP" "default" (randAlphaNum 16 | b64enc)) }}
  POLL_ENCRYPTION_KEY: {{ include "secure-polling-app.secretValue" (dict "ctx" . "key" "POLL_ENCRYPTION_KEY" "default" (randBytes 32)) }}
{{- end }}
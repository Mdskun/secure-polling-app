apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secure-polling-app.fullname" . }}
  labels:
    {{- include "secure-polling-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "secure-polling-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secure-polling-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "secure-polling-app.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.init.enabled }}
      initContainers:
        # Idempotent one-time bootstrap: create DB tables + admin user before
        # gunicorn starts. Safe across restarts and reschedules.
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "python init_db.py && python create_admin.py"]
          envFrom:
            - configMapRef:
                name: {{ include "secure-polling-app.configName" . }}
            - secretRef:
                name: {{ include "secure-polling-app.secretName" . }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.env.DATA_DIR }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.init.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: poll-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Bypass the image ENTRYPOINT (entrypoint.sh): bootstrap already ran
          # in the init container and the Fernet key comes from the Secret env
          # var, so no key file is written to the shared volume.
          command: ["gunicorn"]
          args: ["-c", "gunicorn.conf.py", "wsgi:app"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "secure-polling-app.configName" . }}
            - secretRef:
                name: {{ include "secure-polling-app.secretName" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.env.DATA_DIR }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- include "secure-polling-app.dataVolume" . | nindent 10 }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
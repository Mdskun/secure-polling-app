{{- if .Values.autoscaling.enabled }}
{{- if not .Values.env.DATABASE_URL }}
{{- fail "autoscaling.enabled requires a shared database. Set env.DATABASE_URL (e.g. postgresql://user:pass@db:5432/poll) - SQLite is single-writer and cannot serve multiple replicas." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "secure-polling-app.fullname" . }}
  labels:
    {{- include "secure-polling-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "secure-polling-app.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poll-data
  labels:
    app: poll-app
    app.kubernetes.io/name: secure-polling-app
spec:
  accessModes:
    - ReadWriteOnce
  # Requests the cluster default StorageClass. To pin a specific one,
  # uncomment and set to e.g. "standard", "gp2", "rook-ceph-block".
  # storageClassName: "standard"
  resources:
    requests:
      storage: 1Gi
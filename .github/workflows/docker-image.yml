name: Docker Image CI

on:
  push:
    branches: [ "main" ]

env:
  IMAGE: ${{ secrets.IMAGE }}
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKERPASS: ${{ secrets.DOCKERPASS }}
  TAG: "latest"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Debug vars
      run: echo "IMAGE=""$IMAGE" "TAG=""$TAG"

    # docker Image build

    - name: Build Docker image
      run: sudo docker build --network=host . -t "$IMAGE:$TAG"

    - name: Login to Docker
      run: echo "$DOCKERPASS" | sudo docker login --username "$DOCKER_USER" --password-stdin

    - name: Push image
      run: sudo docker push "$IMAGE:$TAG"

    # helm

    - name: Package Helm chart
      run: helm package ./helm/secure-polling-app

    - name: Upload Helm artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-chart
        path: "*.tgz"
